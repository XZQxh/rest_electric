# 复制为 config/secrets.toml。此文件含真实密钥，已在 .gitignore 中排除，切勿提交或外发。

[api]
# 抓包得到的业务 token（放在请求头里）。过期后执行：
#   python -m rest_electric refresh-token --token <新值>
token = ""
# 若接口用 Cookie 鉴权，把整条 Cookie 粘进来；不用则留空
cookie = ""
# 额外的固定请求头，抓包后按需补充，例如：
#   Referer = "https://servicewechat.com/wx1234/..."
#   X-Requested-With = "XMLHttpRequest"
[api.extra_headers]

[notify]
# Server酱：https://sct.ftqq.com 获取 SendKey（形如 SCTxxxxx）
sendkey = ""
# PushPlus：https://www.pushplus.plus 获取 token
pushplus_token = ""

# SMTP 兜底（channel = "smtp" 时使用）。QQ 邮箱需使用「授权码」而非登录密码。
smtp_host = ""
smtp_port = 465
smtp_user = ""
smtp_password = ""
smtp_to = ""
