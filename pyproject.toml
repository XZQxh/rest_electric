[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-electric"
version = "0.1.0"
description = "宿舍电费自动记录、趋势预测与低余额告警（纯标准库，零第三方依赖）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "XZQxh" }]
keywords = ["electricity", "monitor", "sqlite", "raspberry-pi", "crawler"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.scripts]
rest-electric = "rest_electric.cli:console"

[project.urls]
Repository = "https://github.com/XZQxh/rest_electric"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
